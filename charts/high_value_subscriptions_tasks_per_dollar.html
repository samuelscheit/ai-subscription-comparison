  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0c;
      --ink: #f5f7fa;
      --muted: #a5acb9;
      --subtle: #707887;
      --grid: rgba(255,255,255,.085);
      --grid-strong: rgba(255,255,255,.18);
      --focus: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .page { width: min(100%, 1280px); }
    .share-frame {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 8 / 5;
      background: var(--bg);
    }

    .chart-svg { display: block; width: 100%; height: 100%; }
    .chart-svg text { font-family: inherit; font-variant-numeric: tabular-nums; }
    .chart-svg .title { fill: var(--ink); font-size: 72px; font-weight: 700; letter-spacing: -.045em; }
    .chart-svg .subtitle { fill: var(--muted); font-size: 27px; font-weight: 450; letter-spacing: -.01em; }
    .chart-svg .axis-title { fill: var(--muted); font-size: 17px; font-weight: 600; letter-spacing: .055em; }
    .chart-svg .tick { fill: var(--subtle); font-size: 16px; font-weight: 500; }
    .chart-svg .line-label { fill: var(--ink); font-size: 16px; font-weight: 650; }
    .chart-svg .line-plan { fill: var(--subtle); font-size: 14px; font-weight: 500; }
    .chart-svg .axis-higher { fill: var(--subtle); font-size: 14px; font-style: italic; font-weight: 500; letter-spacing: .02em; }
    .chart-svg .annotation-label { fill: var(--ink); font-size: 18px; font-weight: 700; }
    .chart-svg .annotation-value { fill: var(--muted); font-size: 15px; font-weight: 500; }
    .chart-svg .note { fill: var(--subtle); font-size: 13px; letter-spacing: .01em; }
    .chart-svg .signature { fill: var(--subtle); font-size: 14px; font-weight: 650; letter-spacing: .02em; }

    .ui-only {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }
    .ui-only button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      color: var(--ink);
      padding: 9px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .ui-only button:hover { background: rgba(255,255,255,.10); }
    .ui-only button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    .tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      min-width: 210px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      background: rgba(20,22,27,.94);
      box-shadow: 0 16px 36px rgba(0,0,0,.32);
      color: var(--ink);
      opacity: 0;
      transform: translate3d(0, 4px, 0);
      transition: opacity 140ms ease, transform 140ms ease;
    }
    .tooltip[data-visible="true"] { opacity: 1; transform: translate3d(0, 0, 0); }
    .tooltip .tip-name { font-size: 14px; font-weight: 650; }
    .tooltip .tip-meta { margin-top: 3px; color: var(--muted); font-size: 13px; }

    body.export-mode { padding: 0; }
    body.export-mode .page { width: 4800px; }
    body.export-mode .share-frame { width: 4800px; height: 3000px; aspect-ratio: auto; }
    body.export-mode .ui-only, body.export-mode .tooltip { display: none !important; }

    @media (max-width: 720px) {
      body { padding: 0; }
      .page { width: 100%; }
      .ui-only { padding: 0 12px 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .tooltip { transition: none; } }
    @media print {
      body { padding: 0; }
      .ui-only, .tooltip { display: none !important; }
      .share-frame { width: 4800px; height: 3000px; }
    }
  </style>

  <script>
    const DATA = JSON.parse(document.getElementById('benchmark-data').textContent);
    const NS = 'http://www.w3.org/2000/svg';
    const VIEW = { width: 1600, height: 1000 };
    const plot = { left: 128, top: 275, right: 1450, bottom: 780 };
    const plotWidth = plot.right - plot.left;
    const plotHeight = plot.bottom - plot.top;
    const COLORS = {
      opus: '#F6C86E',
      sonnet: '#F2A65A',
      sol: '#5DE2C1',
      astra: '#2EB7A7',
      grok47: '#76A8FF',
      grok46: '#9D8CFF',
      luna: '#FF7AB6'
    };
    const MODEL_ORDER = [
      { model: 'claude-opus-5.5', color: COLORS.opus, label: 'Claude Opus 5.5' },
      { model: 'claude-sonnet-5.5', color: COLORS.sonnet, label: 'Claude Sonnet 5.5' },
      { model: 'gpt-6.1-sol', color: COLORS.sol, label: 'GPT-6.1 Sol' },
      { model: 'gpt-6-astra', color: COLORS.astra, label: 'GPT-6 Astra' },
      { model: 'grok-4.7', color: COLORS.grok47, label: 'Grok 4.7' },
      { model: 'grok-4.6', color: COLORS.grok46, label: 'Grok 4.6' },
      { model: 'gpt-6-luna', color: COLORS.luna, label: 'GPT-6 Luna' }
    ];
    const SERIES_PLAN = {
      'claude-opus-5.5': 'Claude Max 20x',
      'claude-sonnet-5.5': 'Claude Max 20x',
      'gpt-6.1-sol': 'ChatGPT Pro 20x',
      'gpt-6-astra': 'ChatGPT Pro 20x',
      'grok-4.7': 'SuperGrok Heavy',
      'grok-4.6': 'SuperGrok Heavy',
      'gpt-6-luna': 'ChatGPT Plus'
    };
    const EFFORT_LABELS = { med: 'medium', high: 'high', xhigh: 'x-high', max: 'max' };
    const effortOrder = { med: 0, high: 1, xhigh: 2, max: 3 };
    const svg = document.getElementById('chart');
    const frame = document.getElementById('share-frame');
    const tooltip = document.getElementById('tooltip');
    const tipName = document.getElementById('tip-name');
    const tipMeta = document.getElementById('tip-meta');

    const plotted = DATA.filter((row) => SERIES_PLAN[row.model] === row.plan);
    const numeric = (key) => plotted.map((d) => Number(d[key])).filter(Number.isFinite);
    const extent = (values) => [Math.min(...values), Math.max(...values)];
    const [xMin, xMaxRaw] = extent(numeric('intel_score'));
    const [yMinRaw, yMaxRaw] = extent(numeric('tasks_per_dollar_measured'));
    const xDomain = [Math.floor(xMin - 1), Math.ceil(xMaxRaw + 1)];
    // Luna's direct ChatGPT Plus measurement is much higher than the flagship
    // rows. A logarithmic y-axis keeps all seven evidence-backed curves legible
    // without hiding the lower-value plans at the baseline.
    const yDomain = [1, Math.ceil(yMaxRaw * 1.25 / 50) * 50];
    const xScale = (value) => plot.left + ((value - xDomain[0]) / (xDomain[1] - xDomain[0])) * plotWidth;
    const yScale = (value) => plot.bottom - ((Math.log(value) - Math.log(yDomain[0])) / (Math.log(yDomain[1]) - Math.log(yDomain[0]))) * plotHeight;
    const fmt = (value) => Number(value).toFixed(1);
    const compactPlan = (plan) => plan
      .replace('Claude Max ', 'Max ')
      .replace('ChatGPT Pro ', 'Pro ')
      .replace('SuperGrok ', 'Grok ');

    const grouped = new Map();
    plotted.forEach((row) => {
      if (!grouped.has(row.model)) grouped.set(row.model, []);
      grouped.get(row.model).push(row);
    });
    grouped.forEach((rows) => rows.sort((a, b) => effortOrder[a.effort] - effortOrder[b.effort]));

    const el = (tag, attrs = {}, textContent = '') => {
      const node = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (textContent) node.textContent = textContent;
      return node;
    };
    const add = (node) => svg.appendChild(node);
    const line = (x1, y1, x2, y2, stroke, width = 1, opacity = 1, dash = '') => add(el('line', { x1, y1, x2, y2, stroke, 'stroke-width': width, opacity, 'stroke-dasharray': dash }));
    const text = (x, y, value, className, attrs = {}) => add(el('text', { x, y, class: className, ...attrs }, value));

    add(el('rect', { x: 0, y: 0, width: VIEW.width, height: VIEW.height, fill: 'transparent' }));
    text(128, 92, 'Tasks per $1', 'title');
    text(128, 132, 'AI coding subscriptions · estimated monthly task capacity', 'subtitle');
    text(1450, 56, 'SELECTED PLANS', 'axis-title', { 'text-anchor': 'end' });
    text(1450, 82, 'snapshot · 05 Oct 2026', 'note', { 'text-anchor': 'end' });
    add(el('rect', { x: plot.left, y: plot.top, width: plotWidth, height: plotHeight, fill: 'rgba(255,255,255,.018)', stroke: 'rgba(255,255,255,.12)', 'stroke-width': 1, 'data-chart-frame': 'true' }));

    const xTicks = [30, 35, 40, 45, 50, 55, 60].filter((tick) => tick >= xDomain[0] && tick <= xDomain[1]);
    const yTicks = [1, 3, 10, 30, 100, 300].filter((tick) => tick >= yDomain[0] && tick <= yDomain[1]);
    yTicks.forEach((tick) => {
      const y = yScale(tick);
      line(plot.left, y, plot.right, y, tick === 1 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.085)', tick === 1 ? 1.4 : 1);
      text(plot.left - 18, y + 6, String(tick), 'tick', { 'text-anchor': 'end' });
    });
    xTicks.forEach((tick) => {
      const x = xScale(tick);
      line(x, plot.top, x, plot.bottom, 'rgba(255,255,255,.07)', 1, 1, '4 8');
      text(x, plot.bottom + 34, String(tick), 'tick', { 'text-anchor': 'middle' });
    });
    text((plot.left + plot.right) / 2, plot.bottom + 76, 'Artificial Analysis Intelligence Index', 'axis-title', { 'text-anchor': 'middle' });
    text((plot.left + plot.right) / 2, plot.bottom + 100, '(higher is better)', 'axis-higher', { 'text-anchor': 'middle' });
    text(42, (plot.top + plot.bottom) / 2 - 26, 'ESTIMATED TASKS / $1 / MONTH · LOG SCALE', 'axis-title', { 'text-anchor': 'middle', transform: `rotate(-90 42 ${(plot.top + plot.bottom) / 2 - 26})` });
    text(66, (plot.top + plot.bottom) / 2 + 12, '(higher is better)', 'axis-higher', { 'text-anchor': 'middle', transform: `rotate(-90 66 ${(plot.top + plot.bottom) / 2 + 12})` });

    const seriesNodes = new Map();
    MODEL_ORDER.forEach((config) => {
      const rows = grouped.get(config.model) || [];
      if (!rows.length) return;
      const g = el('g', { 'data-series': config.model });
      const points = rows.map((row) => ({ row, x: xScale(row.intel_score), y: yScale(row.tasks_per_dollar_measured) }));
      g.appendChild(el('path', {
        d: points.map((point, index) => `${index ? 'L' : 'M'} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(' '),
        fill: 'none', stroke: config.color, 'stroke-width': 5.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .94
      }));
      points.forEach(({ row, x, y }) => {
        const marker = el('circle', {
          cx: x, cy: y, r: 8, fill: config.color, stroke: '#090a0c', 'stroke-width': 3,
          tabindex: 0,
          'aria-label': `${config.label}, ${EFFORT_LABELS[row.effort]} reasoning: ${fmt(row.tasks_per_dollar_measured)} estimated tasks per dollar`,
          'data-tooltip': `${config.label} · ${EFFORT_LABELS[row.effort]} · ${fmt(row.tasks_per_dollar_measured)} tasks/$`
        });
        const show = () => showTooltip(config, row, x, y);
        marker.addEventListener('mouseenter', show);
        marker.addEventListener('focus', show);
        marker.addEventListener('mouseleave', hideTooltip);
        marker.addEventListener('blur', hideTooltip);
        g.appendChild(marker);
      });
      const last = points[points.length - 1];
      const lastRow = rows[rows.length - 1];
      const labelOffsets = {
        'claude-opus-5.5': { dx: 18, dy: -18 },
        'claude-sonnet-5.5': { dx: 18, dy: 26 },
        'gpt-6.1-sol': { dx: 18, dy: -18 },
        'gpt-6-astra': { dx: 18, dy: 26 },
        'grok-4.7': { dx: 18, dy: -18 },
        'grok-4.6': { dx: 18, dy: 26 },
        'gpt-6-luna': { dx: 18, dy: -18 }
      };
      const offset = labelOffsets[config.model];
      const label = el('text', { x: last.x + offset.dx, y: last.y + offset.dy, class: 'line-label', 'text-anchor': 'start' });
      label.appendChild(el('tspan', { x: last.x + offset.dx, dy: 0, fill: config.color, 'font-weight': 700 }, config.label));
      label.appendChild(el('tspan', { x: last.x + offset.dx, dy: 19, class: 'line-plan' }, compactPlan(lastRow.plan)));
      g.appendChild(label);
      add(g);
      seriesNodes.set(config.model, g);
    });

    text(128, 936, 'Sources: real-api-pricing · Artificial Analysis Intelligence Index v4.3', 'note');
    text(1450, 960, 'by @samuelscheit', 'signature', { 'text-anchor': 'end' });
    text(128, 960, 'Formula: monthly API-value allowance ÷ (benchmark cost per task × subscription fee)', 'note');

    function showTooltip(config, row, x, y) {
      tipName.textContent = config.label;
      tipMeta.textContent = `${EFFORT_LABELS[row.effort]} · ${fmt(row.tasks_per_dollar_measured)} estimated tasks / $1`;
      const frameRect = frame.getBoundingClientRect();
      const scale = frameRect.width / VIEW.width;
      const left = Math.min(Math.max(x * scale + 18, 14), frameRect.width - 230);
      const top = Math.min(Math.max(y * scale - 12, 14), frameRect.height - 82);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
      tooltip.dataset.visible = 'true';
      tooltip.setAttribute('aria-hidden', 'false');
    }
    function hideTooltip() {
      tooltip.dataset.visible = 'false';
      tooltip.setAttribute('aria-hidden', 'true');
    }

    function downloadPng() {
      const clone = svg.cloneNode(true);
      const computed = getComputedStyle(document.documentElement);
      const style = document.createElementNS(NS, 'style');
      style.textContent = `
        text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
        .title { fill: ${computed.getPropertyValue('--ink').trim()}; font-size: 72px; font-weight: 700; letter-spacing: -.045em; }
        .subtitle { fill: ${computed.getPropertyValue('--muted').trim()}; font-size: 27px; font-weight: 450; }
        .axis-title { fill: ${computed.getPropertyValue('--muted').trim()}; font-size: 17px; font-weight: 600; letter-spacing: .055em; }
        .tick { fill: ${computed.getPropertyValue('--subtle').trim()}; font-size: 16px; font-weight: 500; }
        .line-label { fill: ${computed.getPropertyValue('--ink').trim()}; font-size: 16px; font-weight: 650; }
        .line-plan, .note { fill: ${computed.getPropertyValue('--subtle').trim()}; font-size: 14px; font-weight: 500; }
        .axis-higher { fill: ${computed.getPropertyValue('--subtle').trim()}; font-size: 14px; font-style: italic; font-weight: 500; }
        .annotation-label { fill: ${computed.getPropertyValue('--ink').trim()}; font-size: 18px; font-weight: 700; }
        .annotation-value { fill: ${computed.getPropertyValue('--muted').trim()}; font-size: 15px; font-weight: 500; }
        .signature { fill: ${computed.getPropertyValue('--subtle').trim()}; font-size: 14px; font-weight: 650; }
      `;
      clone.insertBefore(style, clone.firstChild);
      const source = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([`<?xml version="1.0" encoding="UTF-8"?>${source}`], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 4800;
        canvas.height = 3000;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = computed.getPropertyValue('--bg').trim();
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => {
          const link = document.createElement('a');
          link.download = 'high_value_subscriptions_tasks_per_dollar.png';
          link.href = URL.createObjectURL(blob);
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }, 'image/png');
      };
      image.src = url;
    }

    document.getElementById('download-png').addEventListener('click', downloadPng);
  </script>
